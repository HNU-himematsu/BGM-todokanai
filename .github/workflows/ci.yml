name: CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Build
        working-directory: frontend
        env:
          VITE_PUBLIC_BASE_URL: ${{ vars.PUBLIC_BASE_URL || 'https://game.himematsu.cn' }}
          VITE_AUDIO_URL: ${{ vars.AUDIO_URL || 'https://himematsu.oss-cn-guangzhou.aliyuncs.com/bgm/event-demo.mp3' }}
        run: npm run build

  backend:
    name: Backend verify
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          cache-dependency-path: backend/pom.xml

      - name: Verify
        working-directory: backend
        run: mvn -B -ntp verify
